<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabeca(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Biblioteca iB2B'">Biblioteca</title>
    <link rel="stylesheet" th:href="@{/estilo.css}">
</head>
<body>

<header class="topo" th:fragment="topo">
    <div class="marca"><span class="logo">iB2B</span> Biblioteca</div>
    <div class="quem" th:if="${usuario != null}">
        <span class="perfil" th:text="${usuario.perfil().rotulo()}">Estudante</span>
        <strong th:text="${usuario.nome()}">Ana Souza</strong>
        <span class="suave" th:if="${usuario.perfil().name() != 'ADMINISTRADOR'}" th:text="${usuario.identificador()}">M-100</span>
    </div>
    <div class="data">Hoje: <strong th:text="${#temporals.format(hoje, 'dd/MM/yyyy')}">13/11/2026</strong></div>
    <form th:if="${usuario != null}" method="post" th:action="@{/sair}" class="sair"><button class="link">Sair</button></form>
</header>

<div th:fragment="mensagens">
    <div class="msg ok" th:if="${sucesso}" th:text="${sucesso}">ok</div>
    <div class="msg erro" th:if="${erro}" th:text="${erro}">erro</div>
</div>

<!-- Situação do livro com nome amigável -->
<span th:fragment="situacao(s)" class="etiqueta" th:classappend="${s}" th:switch="${s.name()}">
    <th:block th:case="'LIVRE'">Disponível</th:block>
    <th:block th:case="'RESERVADO'">Reservado</th:block>
    <th:block th:case="'EMPRESTADO'">Emprestado</th:block>
    <th:block th:case="'RENOVADO'">Emprestado (renovado)</th:block>
    <th:block th:case="'DEVOLVIDO'">Em inspeção</th:block>
    <th:block th:case="'REPARANDO'">Em reparo</th:block>
    <th:block th:case="'INCINERADO'">Descartado</th:block>
</span>

<!-- Organização do acervo: o mesmo desenho para unidade, seção e subseção (Composite) -->
<ul class="arvore" th:fragment="arvore(no)">
    <li>
        <strong th:text="${no.nome()}">Central</strong>
        <span class="etiqueta" th:text="${no.tipo().name() == 'SECAO'} ? 'Seção' : (${no.tipo().name() == 'SUBSECAO'} ? 'Subseção' : 'Unidade')">Unidade</span>
        <span class="suave" th:text="${no.totalDeLivros()} + ' livro(s)'">5 livros</span>
        <small class="suave" th:unless="${#lists.isEmpty(no.idsDiretos())}" th:text="' · livros nº ' + ${#strings.listJoin(no.idsDiretos(), ', ')}"></small>
        <th:block th:each="sub : ${no.subgrupos()}">
            <div th:replace="~{fragmentos :: arvore(${sub})}"></div>
        </th:block>
    </li>
</ul>
</body>
</html>
