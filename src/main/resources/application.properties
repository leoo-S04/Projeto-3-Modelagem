# Aplicação web da biblioteca (biblioteca.jar com Tomcat embutido)
spring.application.name=biblioteca
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.thymeleaf.cache=false

# Família de persistência (Abstract Factory, Req. 8): PRODUCAO = arquivo JSON; TESTE = memória
biblioteca.perfil=PRODUCAO
# Arquivo de dados (artefato biblioteca.json do diagrama de implantação)
biblioteca.arquivo=dados/biblioteca.json
# Na primeira execução (arquivo inexistente), os dados de demonstração são copiados daqui
biblioteca.exemplo=dados/exemplo.json
