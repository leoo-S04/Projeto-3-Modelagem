# Perfil opcional "https" (diagrama de implantação: navegador ↔ servidor por HTTPS).
# Gere o certificado de teste uma vez (ver README) e rode com --spring.profiles.active=https
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=dados/biblioteca.p12
server.ssl.key-store-password=biblioteca
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=biblioteca
